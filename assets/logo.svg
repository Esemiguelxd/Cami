<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shrimpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="50%" stop-color="#ff5200"/>
      <stop offset="100%" stop-color="#e63e00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff5200" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Main Shrimp Head and Rostrum -->
    <path d="M 230,120 C 270,110 320,125 325,180 C 290,195 240,190 200,175 C 160,160 135,165 90,185 C 120,165 170,145 220,135 Z" fill="url(#shrimpGrad)"/>
    <path d="M 210,135 C 280,125 315,160 315,185 C 275,190 230,185 195,170 C 160,158 130,165 85,190 C 130,165 180,145 210,135 Z" fill="#ffffff" opacity="0.25"/>
    <!-- Eye & Shell Details -->
    <circle cx="280" cy="155" r="7" fill="#ffffff" opacity="0.8"/>
    <circle cx="280" cy="155" r="4" fill="#1a1a1a"/>
    <!-- Antennae -->
    <path d="M 215,135 C 150,150 90,200 80,270 C 75,310 100,340 120,350 C 145,360 160,335 140,310 C 120,285 110,240 150,195 C 175,168 200,150 215,135 Z" fill="url(#shrimpGrad)" opacity="0.95"/>
    <path d="M 200,145 C 140,175 110,230 115,290 C 118,320 135,335 130,345 C 115,340 100,310 102,280 C 105,230 140,180 200,145 Z" fill="url(#shrimpGrad)" opacity="0.85"/>
    <!-- Rostrum Spine -->
    <path d="M 85,188 C 50,180 30,150 20,130 C 40,160 70,175 105,182 Z" fill="url(#shrimpGrad)"/>
    <!-- Thorax & Abdominal Segments -->
    <!-- Segment 1 -->
    <path d="M 330,185 C 380,185 410,215 415,260 C 375,255 350,235 325,210 Z" fill="url(#shrimpGrad)"/>
    <!-- Segment 2 -->
    <path d="M 416,268 C 420,305 400,340 380,365 C 355,340 350,305 355,275 C 375,272 398,270 416,268 Z" fill="url(#shrimpGrad)"/>
    <!-- Segment 3 -->
    <path d="M 378,372 C 355,398 325,418 290,425 C 285,395 300,370 330,350 C 348,358 365,365 378,372 Z" fill="url(#shrimpGrad)"/>
    <!-- Segment 4 -->
    <path d="M 285,427 C 250,435 220,430 190,415 C 205,390 230,380 260,380 C 270,398 278,414 285,427 Z" fill="url(#shrimpGrad)"/>
    <!-- Segment 5 -->
    <path d="M 188,412 C 160,395 145,370 142,345 C 165,345 185,360 200,380 C 195,392 191,402 188,412 Z" fill="url(#shrimpGrad)"/>
    <!-- Tail Fan (Uropods & Telson) -->
    <path d="M 140,340 C 110,335 80,340 60,360 C 50,370 50,385 65,395 C 90,410 130,390 140,365 Z" fill="url(#shrimpGrad)"/>
    <path d="M 145,342 C 125,360 110,395 110,420 C 110,435 125,445 140,440 C 165,430 168,395 155,360 Z" fill="url(#shrimpGrad)"/>
    <!-- Walking Legs (Pereiopods / Pleopods) -->
    <g fill="url(#shrimpGrad)" opacity="0.95">
      <path d="M 230,195 C 220,230 195,250 165,260 C 185,245 205,225 215,200 Z"/>
      <path d="M 255,205 C 245,245 220,270 190,280 C 210,265 230,240 240,210 Z"/>
      <path d="M 280,215 C 275,260 250,285 220,300 C 240,280 260,255 268,220 Z"/>
      <path d="M 305,230 C 300,275 280,305 250,320 C 270,300 290,275 295,235 Z"/>
      <path d="M 325,250 C 320,295 305,325 280,340 C 298,320 312,295 315,255 Z"/>
      <path d="M 340,275 C 335,315 320,345 300,360 C 315,340 328,315 330,280 Z"/>
    </g>
  </g>
</svg>
